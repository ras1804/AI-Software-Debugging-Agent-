[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-software-debugger"
version = "0.1.0"
description = "Portfolio-grade agentic AI software debugging agent with sandboxed execution and LLMOps evaluation."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "streamlit>=1.42,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "langgraph>=0.3,<1",
  "langchain-core>=0.3,<1",
  "langchain-openai>=0.3,<1",
  "openai>=1.60,<2",
  "mlflow>=2.20,<4",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.15,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
